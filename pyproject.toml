[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "esmfold2-mlx"
version = "0.1.0"
description = "ESMFold2 on Apple silicon: MLX/Metal folding trunk, diffusion sampler and 8-bit ESMC-6B (unofficial port)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
keywords = ["protein structure prediction", "ESMFold2", "MLX", "Apple silicon", "Metal"]
classifiers = [
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
# Versions are the ones every published number was produced with; the MPS/MLX workarounds are
# version-sensitive, so after changing torch, mlx or esm run tools/regression_check.py.
dependencies = [
    "torch>=2.11,<2.12",
    "mlx>=0.32.3,<0.33",
    "esm>=3.4.1",
    "accelerate>=1.15",
    "safetensors>=0.8",
    "numpy>=2.5",
]

[project.optional-dependencies]
eval = ["pandas>=3.0", "tmtools>=0.3"]

[project.scripts]
esmfold2-mlx = "esmfold2_mlx.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/esmfold2_mlx"]
